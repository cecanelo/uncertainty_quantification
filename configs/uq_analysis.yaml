# Base configuration for uncertainty analysis.
# This file is intended to be read by notebooks or scripts that import
# `scripts/uq_eval.py`. It specifies where eval outputs live, which
# runs to include, and high-level analysis settings.
#
# Fields:
#   settings.eval_root        : root directory for eval outputs
#   settings.dido_mode        : "logistic" or "raw"
#   settings.n_mc_samples     : expected MC samples per point (for info)
#   settings.n_ensemble_members : expected ensemble size (for info)
#   settings.n_nf_samples     : NF samples per point when drawing from flows
#   settings.large_error_quantile : quantile used for the "large error" threshold
#
#   runs.*                    : explicit run directories under eval_root.
#                               If null, analysis code can fall back to
#                               discovering the latest directory matching
#                               the corresponding pattern in run_patterns.
#
#   run_patterns.*            : glob patterns used for discovery when runs.*
#                               is null.

settings:
  eval_root: outputs/evals
  # Optional prefix added to discovered run directories (e.g., "point_<prefix>_*")
  run_prefix: "_l"
  dido_mode: logistic
  n_mc_samples: 50
  n_ensemble_members: 10
  n_nf_samples: 200
  large_error_quantile: 0.95

runs:
  point: null
  laplace_analytic: null   # uses same eval dir as laplace_mc
  laplace_mc: null
  gauss_analytic: null     # uses same eval dir as gauss_mc
  gauss_mc: null
  laplace_ensemble: null
  gauss_ensemble: null
  nf_laplace: null
  nf_gauss: null
  dido_laplace: null
  dido_gauss: null

run_patterns:
  point: point{prefix}*
  laplace_analytic: lpl{prefix}*
  laplace_mc: lpl{prefix}*
  gauss_analytic: gau{prefix}*
  gauss_mc: gau{prefix}*
  laplace_ensemble: esm_laplace_lpl{prefix}*
  gauss_ensemble: esm_gauss_gau{prefix}*
  nf_laplace: nf_lpl{prefix}*
  nf_gauss: nf_gau{prefix}*
  dido_laplace: dido_lpl{prefix}*
  dido_gauss: dido_gau{prefix}*

# Method toggles (enable/disable analyses per family)
enable_methods:
  point: true
  laplace_analytic: true
  laplace_mc: true
  gauss_analytic: true
  gauss_mc: true
  laplace_ensemble: false
  gauss_ensemble: false
  nf_laplace: false
  nf_gauss: false
  dido_laplace: false
  dido_gauss: false
