seed: 1

slurm:
  partition: "STUD"
  time: "00:50:00"
  mem_gb: 32
  cpus: 4
  gpus: 1
  job_name: "dido"
  conda_env: "thesis"

data:
  csv_path: "/home/canelo/uncertainty_quantification/datasets/craigslist_cleaned.csv"

# Single source: filled by HPO via base_run_dir; other paths are inferred in train_dido.py
base_run_dir: ""

base_artifacts:
  # Path to the base run's preproc_meta.json (optional if base_run_dir is set)
  preproc_meta_path: ""

base_run:
  # Used for auto-creating base preds if they are missing (optional if base_run_dir is set)
  config_path: ""
  model_dir: ""

base_preds:
  # If present, use these; otherwise auto-create them via eval_regression.py
  auto_create: true

binning:
  K: 10
  use_abs_error: true
  include_mu_as_feature: true

model:
  hidden_dims: [256, 128]
  activation: "relu"
  dropout: 0.10

training:
  device: "cuda"
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  batch_size: 1024
  num_workers: 2
  pin_memory: true
  patience: 15
  eval_after_train: false

io:
  outdir: "/home/canelo/uncertainty_quantification/outputs/trainings/{job}_{ts}_{jobid}"
  evals_root: "outputs/evals"
