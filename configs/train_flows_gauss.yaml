seed: 1

slurm:
  partition: "STUD"
  time: "00:55:00"
  mem_gb: 32
  cpus: 4
  gpus: 1
  job_name: "nf_gau"
  conda_env: "thesis"
data:
  csv_path: "/home/canelo/uncertainty_quantification/datasets/craigslist_cleaned.csv"

# Single source: set base_run_dir to the Gaussian base run; other paths will be inferred.
base_run_dir: ""

base_artifacts:
  # Path to the base Gaussian run's preproc_meta.json (optional if base_run_dir is set)
  preproc_meta_path: ""

base_run:
  # Used for auto-creating flow CSVs if they are missing (optional if base_run_dir is set)
  config_path: ""
  model_dir: ""

base_preds:
  # If present, use these flow CSVs; otherwise auto-create them below
  # train_csv: "/home/canelo/uncertainty_quantification/outputs/evals/gauss_run/flow_train.csv"
  # val_csv: "/home/canelo/uncertainty_quantification/outputs/evals/gauss_run/flow_val.csv"

flow_dumps:
  auto_create: true
  output_dir: null   # default: NF outdir (recommended)
  # info on whether files were created or reused is recorded in run_meta

training:
  device: "cuda"
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0
  batch_size: 1024
  num_workers: 2
  pin_memory: true

nf:
  transform: "affine"      # "affine" (MAF) or "spline"
  hidden_features: 256
  num_layers: 6
  actnorm: true
  num_bins: 8              # used for spline; ignored for affine
  standardize: true        # use z = (y_true_t - mu_t) / scale_t

io:
  outdir: "/home/canelo/uncertainty_quantification/outputs/trainings/flows/nf_{job}_{ts}_{jobid}"
  evals_root: "outputs/evals"

evaluation:
  after_train: true
  splits: ["test"]
