#
# Batch configuration for running OOD evaluations for base regression models.
# This file is consumed by scripts/run_ood_eval_batch.py.
#
# You normally run:
#   python scripts/run_ood_eval_batch.py \
#       --auto-discover-base
#       # (optional) override run_tag: --run-tag "_xs_"
#
# In that mode, base_runs below are ignored and the script scans
# outputs/trainings/** for runs whose directory name contains run_tag
# (see below) and have a used_config.yaml. You can still use the
# base_runs block if you ever want fully manual control.

run_tag: "_l"   # default tag for auto-discovery; can be overridden with --run-tag

base_runs:
  point_l:
    enabled: true
    config: outputs/trainings/training_point_l/point_l_20251220-010530_303656/used_config.yaml
    outdir: outputs/trainings/training_point_l/point_l_20251220-010530_303656

  lpl_l:
    enabled: true
    config: outputs/trainings/training_lpl_l/lpl_l_20251220-010458_303655/used_config.yaml
    outdir: outputs/trainings/training_lpl_l/lpl_l_20251220-010458_303655

  gau_l:
    enabled: true
    config: outputs/trainings/training_gau_l/gau_l_20251220-013128_303690/used_config.yaml
    outdir: outputs/trainings/training_gau_l/gau_l_20251220-013128_303690

  nf_lpl:
    enabled: false
  nf_gau:
    enabled: false
  dido_lpl:
    enabled: false
  dido_gau:
    enabled: false

ood_sets:
  knn_hard:
    enabled: true
    csv: datasets/craigslist_ood_knn.csv


options:
  # Which split name to record in the OOD prediction CSVs.
  split: test
