base_config: "outputs/trainings/training_gau_l_craigs/gau_l_craigs_20260112-204108_507268/used_config.yaml"

run:
  mode: "slurm"

slurm:
  partition: "STUD"
  time: "00:50:00"
  mem_gb: 32
  cpus: 4
  gpus: 1
  job_name: "esm"   # will be prefixed esm_<head>_ automatically
  conda_env: "thesis"
  max_parallel: 5

ensemble:
  n_members: 10
  base_seed: 1

member_overrides:
  training:
    eval_after_train: true
    mc_eval:
      enabled: false         # toggle MC-dropout for ensemble members here
      n_samples: 50         # adjust per ensemble without touching base config
      include_samples: true
      batch_size: 512

io:
  ensemble_root: "outputs/trainings/ensembles/{job}_{ts}_{jobid}"  # {job} already prefixed esm_<head>_
  evals_root: "outputs/craigs_evals"
