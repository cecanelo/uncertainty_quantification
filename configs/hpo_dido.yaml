study:
    name: "dido_tiny"
    storage: "sqlite:///optuna_studies/hpo.db"
    direction: "minimize"
    resume: true

budget:
    n_trials: 3                # small run; increase for full HPO

resources:
    partition: "TEST"
    time: "00:40:00"
    mem_gb: 30
    cpus_per_task: 2
    gpus: 1                    # CPU is fine for small DIDO; set to 1 if you prefer GPU
    conda_env: "thesis_pascal"
    max_parallel: 4

io:
    outputs_root: "outputs/optuna"
    logs_root: "logs"
    job_name_template: "{study}_{ts}"
    trial_dir_template: "trial_{trial:05d}"

base_config:
    train_config_path: "configs/train_dido.yaml"
    train_script_path: "scripts/train_dido.py"

repro:
    snapshot_hpo_config: true
    snapshot_base_config: true
    save_pip_freeze: false
    save_git_commit: false

pruner:
    name: "median"
    params:
        n_startup_trials: 2

search_space:
    - { name: "training.epochs",            dist: "choice", choices: [5] }
    - { name: "binning.use_abs_error",      dist: "choice", choices: [true, false] }
    - { name: "binning.include_mu_as_feature", dist: "choice", choices: [true, false] }
    - { name: "model.hidden_dims",          dist: "choice", choices: [[128, 64], [256, 128], [256, 128, 64]] }
    - { name: "model.dropout",              dist: "uniform", low: 0.0, high: 0.3, step: 0.05 }
    - { name: "training.lr",                dist: "loguniform", low: 5.0e-4, high: 3.0e-3 }
    - { name: "training.weight_decay",      dist: "loguniform", low: 1.0e-6, high: 1.0e-2 }
    - { name: "training.batch_size",        dist: "choice", choices: [512, 1024] }

post_run:
    export_best: true
    best_dirname: "best"
    best_filename: "best_hparams.json"
    latest_pointer_dir: "outputs/best_hparams/{study}"
